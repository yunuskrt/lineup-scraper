[project]
name = "lineup-scraper"
version = "0.0.1"
description = "Offline ETL for the Lineup match pool: extraction"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
extend-exclude = ["src", "node_modules", "data", "context", ".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "N"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["extract"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["extract"]

[tool.pytest.ini_options]
testpaths = ["extract/tests"]
pythonpath = ["."]
